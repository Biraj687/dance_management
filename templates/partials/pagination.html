{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="flex items-center justify-between px-4 py-3 border-t border-border-hairline text-sm" aria-label="Pagination">
  <span class="text-text-secondary">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  <div class="flex gap-4">
    {% if page_obj.has_previous %}<a class="text-accent-gold" href="?page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
    {% if page_obj.has_next %}<a class="text-accent-gold" href="?page={{ page_obj.next_page_number }}">Next</a>{% endif %}
  </div>
</nav>
{% endif %}
