{# Live total-fee summary. Updated by students/partials/fee_and_slots_script.html. #}
<div id="fee-summary" class="mt-4 p-4 bg-bg-base border border-accent-gold/30 rounded-lg" aria-live="polite">
  <p class="text-xs font-semibold text-accent-gold uppercase tracking-wider mb-3">Total Fee</p>
  <p class="text-sm text-text-primary mb-3">
    Package: <span class="font-medium" data-fee-package-name>No package selected yet</span>
  </p>
  <dl class="space-y-2">
    <div class="flex items-center justify-between text-sm">
      <dt class="text-text-secondary">Package price</dt>
      <dd class="font-medium text-text-primary" data-fee-package-price>&mdash;</dd>
    </div>
    <div class="flex items-center justify-between text-sm">
      <dt class="text-text-secondary">Admission fee</dt>
      <dd class="font-medium text-text-primary" data-fee-admission>&mdash;</dd>
    </div>
    <div class="flex items-center justify-between text-sm border-t border-border-hairline pt-2">
      <dt class="font-semibold text-accent-gold">Total payable</dt>
      <dd class="font-semibold text-accent-gold" data-fee-total>&mdash;</dd>
    </div>
  </dl>
  <p class="text-xs text-text-secondary mt-3" data-fee-hint>
    Pick a package to see its price and the total fee.
  </p>
</div>
